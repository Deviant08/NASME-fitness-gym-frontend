<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <title>NASME GYM — Member Portal</title>
  <style>
    :root {
      --maroon: #590a0a; --maroon-lt: #7a1010; --maroon-dim: #3a0606;
      --navy: #1a1a50; --navy-lt: #252575; --bg: #0d0d1a; --surface: #13132b;
      --surface2: #1c1c38; --surface3: #252548; --border: #2e2e5a;
      --text: #f4f2f2; --text-dim: #a09fbc; --text-muted: #5f5e7a;
      --success: #2ecc71; --warning: #e67e22; --danger: #c0392b;
      --fd: 'Bebas Neue', sans-serif; --fb: 'DM Sans', sans-serif; --fm: 'JetBrains Mono', monospace;
      --r: 6px; --rl: 12px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { font-size: 62.5%; }
    body { font-family: var(--fb); background: var(--bg); color: var(--text); font-size: 1.4rem; min-height: 100vh; }
    a { text-decoration:none; color:unset; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2.8rem; height: 6.4rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-brand { font-family: var(--fd); font-size: 2.4rem; letter-spacing: 2px; }
    .topbar-brand span { color: var(--maroon-lt); }
    .topbar-right { display:flex; align-items:center; gap:1.6rem; }
    .member-avatar { width: 3.8rem; height: 3.8rem; border-radius: 50%; background: linear-gradient(135deg, var(--maroon), var(--navy)); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-size: 1.6rem; }
    .member-name-top { font-size:1.3rem; font-weight:600; }
    .btn-logout { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); color: var(--text-dim); padding: 0.6em 1.2em; cursor: pointer; font-family: var(--fb); font-size: 1.2rem; }
    .btn-logout:hover { border-color:var(--danger); color:var(--danger); }
    .portal-wrap { max-width: 1100px; margin: 0 auto; padding: 2.4rem 2rem 4rem; }
    .welcome-card { background: linear-gradient(120deg, var(--maroon-dim), var(--navy)); border: 1px solid rgba(89,10,10,0.4); border-radius: var(--rl); padding: 2.4rem; margin-bottom: 2rem; }
    .welcome-card h1 { font-family: var(--fd); font-size: 3.2rem; letter-spacing: 1px; margin-bottom: 0.4rem; }
    .welcome-card p { color: var(--text-dim); font-size: 1.4rem; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
    .stat-mini { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rl); padding: 1.6rem; }
    .stat-mini:hover { border-color: var(--maroon); }
    .stat-mini-label { font-size: 1.1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .stat-mini-value { font-family: var(--fd); font-size: 2.8rem; margin-top: 0.4rem; }
    .stat-mini-sub { font-size: 1.1rem; color: var(--text-dim); margin-top: 0.4rem; }
    .tabs { display: flex; gap: 0.4rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
    .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); padding: 1rem 1.6rem; cursor: pointer; font-family: var(--fb); font-size: 1.3rem; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--maroon-lt); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rl); padding: 2rem; }
    .card-title { font-family: var(--fd); font-size: 2rem; letter-spacing: 1px; margin-bottom: 1.6rem; }
    table { width:100%; border-collapse:collapse; }
    th { font-size: 1.1rem; color: var(--text-muted); text-transform: uppercase; text-align: left; border-bottom: 1px solid var(--border); padding: 0.8rem; }
    td { padding: 1rem 0.8rem; border-bottom: 1px solid rgba(46,46,90,0.5); font-size: 1.3rem; }
    tr:last-child td { border-bottom: none; }
    .badge { display:inline-block; padding:3px 9px; border-radius:2px; font-size:1.1rem; font-weight:600; }
    .badge-active { background: rgba(46,204,113,0.15); color: var(--success); }
    .badge-pending { background: rgba(230,126,34,0.15); color: var(--warning); }
    .empty-state { text-align:center; padding:3rem; color: var(--text-muted); }
    .empty-state div { font-size: 3rem; margin-bottom: 0.8rem; }
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    #login-screen.hidden, #portal-app.hidden { display: none; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rl); padding: 3rem; width: 100%; max-width: 420px; }
    .login-box h1 { font-family: var(--fd); font-size: 3rem; margin-bottom: 0.4rem; }
    .login-box p { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.3rem; }
    .field { margin-bottom: 1.4rem; }
    .field label { display:block; font-size: 1.2rem; color: var(--text-dim); margin-bottom: 0.4rem; }
    .field input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); padding: 1rem 1.2rem; font-size: 1.4rem; font-family: var(--fb); }
    .field input:focus { outline: none; border-color: var(--maroon-lt); }
    .login-error { display:none; color: var(--danger); font-size: 1.3rem; margin-bottom: 1rem; }
    .login-error.show { display:block; }
    .btn-primary { width: 100%; background: var(--maroon); border: none; border-radius: var(--r); color: var(--text); padding: 1.1rem; font-size: 1.5rem; font-family: var(--fb); font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--maroon-lt); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { display:none; padding:1.2rem; border-radius:var(--r); margin-bottom:1.6rem; font-size:1.3rem; }
    .alert.show { display:block; }
    .alert-success { background:rgba(46,204,113,0.08); color:var(--success); }
    .alert-error { background:rgba(192,57,43,0.08); color:var(--danger); }
    .back-link { display:inline-block; margin-top:1.6rem; color: var(--text-muted); font-size: 1.3rem; }
    .back-link:hover { color: var(--maroon-lt); }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>NASME <span style="color:var(--maroon-lt)">GYM</span></h1>
    <p>Member portal — sign in with your member code and registered phone number.</p>
    <div class="login-error" id="login-error"></div>
    <div class="field">
      <label>Member code</label>
      <input type="text" id="m-code" placeholder="e.g. MBR-001" autocomplete="username" />
    </div>
    <div class="field">
      <label>Phone number</label>
      <input type="tel" id="m-phone" placeholder="Registered phone" autocomplete="tel" />
    </div>
    <button class="btn-primary" id="login-btn">Sign In →</button>
    <a class="back-link" href="index.html">← Back to website</a>
  </div>
</div>

<div id="portal-app" class="hidden">
  <header class="topbar">
    <div class="topbar-brand">NASME <span>GYM</span></div>
    <div class="topbar-right">
      <div class="member-avatar" id="portal-avatar">M</div>
      <div class="member-name-top" id="portal-name">Member</div>
      <button class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </header>

  <div class="portal-wrap">
    <div id="portal-alert" class="alert"></div>

    <div class="welcome-card">
      <h1 id="portal-greeting">Welcome back</h1>
      <p>Member ID: <strong id="portal-code">—</strong> · Plan: <strong id="portal-plan">—</strong> · Status: <strong id="portal-status">—</strong></p>
    </div>

    <div class="stats-row">
      <div class="stat-mini">
        <div class="stat-mini-label">Check-ins</div>
        <div class="stat-mini-value" id="sm-checkins">—</div>
        <div class="stat-mini-sub">Total visits</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-label">Payments</div>
        <div class="stat-mini-value" id="sm-payments">—</div>
        <div class="stat-mini-sub">Total transactions</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="payments">💳 Payments</button>
    </div>

    <div class="tab-panel active" id="tab-payments">
      <div class="card">
        <div class="card-title">PAYMENT HISTORY</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Txn ID</th><th>Plan</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>
            </thead>
            <tbody id="portal-payments-tbody">
              <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted)">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://nasme-fitness-gym-backend-production.up.railway.app/api';
let currentMember = null;

async function api(file, method = 'GET', body = null, params = {}) {
  const url = new URL(`${API_BASE}/${file}`);
  Object.entries(params || {}).forEach(([k, v]) => { if (v) url.searchParams.set(k, v); });
  const opts = { method, credentials: 'include', headers: { 'Content-Type': 'application/json' } };
  if (body && method !== 'GET') opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || `Error ${res.status}`);
  return json;
}

function showAlert(msg, type = 'success') {
  const a = document.getElementById('portal-alert');
  if (!a) return;
  a.className = `alert alert-${type} show`;
  a.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
  setTimeout(() => a.classList.remove('show'), 4000);
}

async function checkSession() {
  try {
    const json = await api('member-auth.php?action=me');
    if (json.member) { currentMember = json.member; showPortal(); loadProfile(); }
    else showLogin();
  } catch (_) { showLogin(); }
}

function showLogin() {
  document.getElementById('login-screen')?.classList.remove('hidden');
  document.getElementById('portal-app')?.classList.add('hidden');
}

function showPortal() {
  document.getElementById('login-screen')?.classList.add('hidden');
  document.getElementById('portal-app')?.classList.remove('hidden');
}

async function attemptLogin() {
  const code = document.getElementById('m-code')?.value.trim();
  const phone = document.getElementById('m-phone')?.value.trim();
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  if (!code || !phone) {
    if (err) { err.textContent = 'Enter your member code and phone number.'; err.classList.add('show'); }
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Signing in...'; }
  if (err) err.classList.remove('show');
  try {
    const json = await api('member-auth.php?action=login', 'POST', { member_code: code, phone });
    currentMember = json.member;
    showPortal();
    loadProfile();
  } catch (e) {
    if (err) { err.textContent = e.message || 'Login failed'; err.classList.add('show'); }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Sign In →'; }
  }
}

async function loadProfile() {
  try {
    const json = await api('member-auth.php?action=profile');
    renderProfile(json.member, json.payments || []);
  } catch (e) {
    showAlert(e.message || 'Could not load profile', 'error');
  }
}

function renderProfile(member, payments) {
  currentMember = member;
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('portal-name', member.full_name);
  set('portal-code', member.member_code);
  set('portal-plan', member.plan);
  set('portal-status', member.status);
  set('sm-checkins', member.checkins ?? '—');
  set('sm-payments', payments.length);
  const av = document.getElementById('portal-avatar');
  if (av && member.full_name) {
    av.textContent = member.full_name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
  }
  const tbody = document.getElementById('portal-payments-tbody');
  if (!tbody) return;
  tbody.innerHTML = payments.length === 0
    ? `<tr><td colspan="6"><div class="empty-state"><div>💳</div>No payments yet.</div></td></tr>`
    : payments.map(p => `
        <tr>
          <td><span style="font-family:var(--fm);color:#9090e0">${p.txn_code || ''}</span></td>
          <td>${p.plan || ''}</td>
          <td style="font-family:var(--fm);color:var(--success)">₦${Number(p.amount || 0).toLocaleString()}</td>
          <td>${p.method || ''}</td>
          <td><span class="badge badge-${(p.status || '').toLowerCase() === 'completed' ? 'active' : 'pending'}">${p.status || ''}</span></td>
          <td>${p.paid_at || ''}</td>
        </tr>`).join('');
}

async function logout() {
  try { await api('member-auth.php?action=logout', 'POST'); } catch (_) {}
  currentMember = null;
  showLogin();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-btn')?.addEventListener('click', attemptLogin);
  document.getElementById('m-phone')?.addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
  document.getElementById('logout-btn')?.addEventListener('click', logout);
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      const panel = document.getElementById('tab-' + btn.dataset.tab);
      if (panel) panel.classList.add('active');
    });
  });
  checkSession();
});
</script>
</body>
</html>
